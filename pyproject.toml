[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cordesortie"]
branch = true

[tool.coverage.report]
skip_covered = false
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
